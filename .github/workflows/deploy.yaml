      - name: Scope Free edition dependencies
        run: bash deploy/deploy-scoped.sh jooosi-icon-deploy jooosi-icon-free-prefixed

      - name: Prepare Free release artifact
        shell: bash
        run: |
          mkdir -p jooosi-icon-free-prefixed-filtered
          rsync -a \
            --exclude='.*' \
            --exclude-from=.distignore \
            jooosi-icon-free-prefixed/ \
            jooosi-icon-free-prefixed-filtered/
          rm -rf jooosi-icon-free-prefixed
          mv jooosi-icon-free-prefixed-filtered jooosi-icon-free-prefixed

      - name: Verify Free release artifact
        shell: bash
        run: |
          free=jooosi-icon-free-prefixed

          grep -Fq "* Version:             ${FREE_VERSION}" "$free/jooosi-icon.php"
          grep -Fq "public const VERSION = '${FREE_VERSION}';" "$free/constant.php"
          grep -Fq "Stable tag: ${FREE_VERSION}" "$free/readme.txt"
          test -f "$free/vendor/scoper-autoload.php"
          test -f "$free/dist/integration/divi/module.json"
          grep -Fq "function_exists('et_builder_d5_enabled')" \
            "$free/src/Integration/Divi/DiviService.php"

          if grep -Fq "function_exists('JooosiIconDeps\\et_builder_d5_enabled')" \
            "$free/src/Integration/Divi/DiviService.php"; then
            echo "The scoped Divi capability guard was incorrectly prefixed." >&2
            exit 1
          fi

          if grep -Eiq '^[[:space:]]*\*[[:space:]]*Update URI:' "$free/jooosi-icon.php"; then
            echo "The Free artifact must not contain a custom Update URI." >&2
            exit 1
          fi

          if [[ -d "$free/vendor/easy-digital-downloads/edd-sl-sdk" ]]; then
            echo "The Free artifact must not contain the EDD Software Licensing SDK." >&2
            exit 1
          fi

          if grep -Fq 'JooosiIconDeps\dbDelta' "$free/vendor/scoper-autoload.php"; then
            echo "The scoped autoloader contains a broken dbDelta() proxy." >&2
            exit 1
          fi

      - name: Publish Free build to dist-free branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist-free-branch
          cd dist-free-branch
          git fetch origin dist-free || true
          git checkout dist-free 2>/dev/null || git checkout --orphan dist-free
          git rm -rf . 2>/dev/null || true
          git clean -fxd
          cp -a ../jooosi-icon-free-prefixed/. .
          git add --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "The dist-free branch already matches Free ${FREE_VERSION}."
          else
            git commit -m "Build Free Jooosi Icon ${FREE_VERSION}"
            git push origin dist-free
          fi

      - name: Publish Free edition to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.WORDPRESS_ORG_SVN_USERNAME || secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WORDPRESS_ORG_SVN_PASSWORD || secrets.SVN_PASSWORD }}
          SLUG: omni-icon
          BUILD_DIR: jooosi-icon-free-prefixed
          VERSION: ${{ steps.versions.outputs.free }}
          ASSETS_DIR: .wordpress-org

      - name: Create Free plugin archive
        shell: bash
        run: |
          mkdir -p jooosi-icon-free-zip/jooosi-icon
          cp -a jooosi-icon-free-prefixed/. jooosi-icon-free-zip/jooosi-icon/
          cd jooosi-icon-free-zip
          zip -qr "../jooosi-icon-${FREE_VERSION}-free.zip" jooosi-icon -x "*.git*" "*.DS_Store*"

      - name: Upload Free plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: jooosi-icon-${{ steps.versions.outputs.free }}-free
          path: jooosi-icon-${{ steps.versions.outputs.free }}-free.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.content }}
          files: jooosi-icon-${{ steps.versions.outputs.free }}-free.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
