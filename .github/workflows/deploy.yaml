name: Deploy Free Jooosi Icon

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

env:
  COMPOSER_ROOT_VERSION: dev-main

jobs:
  release:
    if: github.repository == 'jooosi-project/jooosi-icon'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Free release version
        id: versions
        shell: bash
        run: |
          free_version="${GITHUB_REF_NAME#v}"

          if [[ ! "$free_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The release tag must be a semantic version such as 1.0.20 or v1.0.20." >&2
            exit 1
          fi

          echo "free=${free_version}" >> "$GITHUB_OUTPUT"
          echo "FREE_VERSION=${free_version}" >> "$GITHUB_ENV"

      - uses: pnpm/setup@v2
        with:
          runtime: node@26
          cache: true
          install: false

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm run build

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Extract Free release notes
        id: changelog
        shell: bash
        run: |
          {
            echo "content<<EOF"
            node deploy/extract-changelog.mjs "$FREE_VERSION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update WordPress.org changelog
        run: node deploy/update-readme-changelog.mjs

      - name: Prepare release source
        shell: bash
        run: |
          mkdir -p jooosi-icon-deploy
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='vendor' \
            --exclude='jooosi-icon-deploy' \
            --exclude='jooosi-icon-*-prefixed' \
            --exclude='dist-branch' \
            --exclude='dist-free-branch' \
            ./ jooosi-icon-deploy/

          composer install \
            --working-dir=jooosi-icon-deploy \
            --no-dev \
            --classmap-authoritative \
            --no-interaction \
            --prefer-dist \
            --ansi

          # Symfony Cache's Redis 5 proxy has signatures incompatible with newer
          # PhpRedis releases. The scoper config also forces the Redis 6 proxy.
          rm -f \
            jooosi-icon-deploy/vendor/symfony/cache/Traits/Redis5Proxy.php \
            jooosi-icon-deploy/vendor/symfony/cache/Traits/RedisCluster5Proxy.php

          composer dump-autoload \
            --working-dir=jooosi-icon-deploy \
            --classmap-authoritative \
            --no-dev \
            --ansi

